name: Build and Push Docker Image
on:
  workflow_call:
    inputs:
      matrix:
        description: "JSON matrix of repository/ref/commit/version_dir/tag/dockerfile entries"
        required: true
        type: string
    secrets:
      RCLONE_CONFIG:
        required: true
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true

env:
  IMAGE_NAME: zkoesters/mhserveremu

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      packages: write
      attestations: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(inputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up rclone
        uses: AnimMouse/setup-rclone@26ef2133e09fd383329a1d4c1fbe6a71db1976c9 # v1.12.0
        with:
          rclone_config: ${{ secrets.RCLONE_CONFIG }}
      - name: Download necessary files
        run: |
          rclone copy r2:private-dependencies/Calligraphy.sip ${{ github.workspace }}
          rclone copy r2:private-dependencies/mu_cdata.sip ${{ github.workspace }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.source=${{ matrix.repository }}
            org.opencontainers.image.revision=${{ matrix.commit }}
            io.mhserveremu.portal.ref=${{ matrix.ref }}
      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: |
            MHSERVEREMU_REPOSITORY=${{ matrix.repository }}
            MHSERVEREMU_REF=${{ matrix.ref }}
            MHSERVEREMU_COMMIT=${{ matrix.commit }}
            MHSERVEREMU_VERSION=${{ matrix.version_dir }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=mhserveremu-${{ matrix.tag }}-${{ matrix.dockerfile }}
          cache-to: type=gha,mode=max,scope=mhserveremu-${{ matrix.tag }}-${{ matrix.dockerfile }}
          annotations: ${{ steps.meta.outputs.annotations }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ matrix.tag }}
