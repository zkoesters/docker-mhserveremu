name: Tests
on:
  pull_request:
    branches: [ "main" ]
    paths:
      - "Dockerfile"
      - "Dockerfile.alpine"
      - "docker-entrypoint.sh"
      - "start-server"
      - "**/Config.ini.template"
      - "Makefile"
      - "**/*.sh"
      - "README.md"
      - "CHANGELOG.md"
      - "deploy/docker/compose/docker-compose.yaml"
      - "deploy/docker/compose/docker-compose.postgresql.yaml"
      - "deploy/docker/compose/README.md"
      - "deploy/docker/compose/.env.example"
      - ".editorconfig"
      - ".editorconfig-checker.json"
      - ".hadolint.yaml"
      - ".github/workflows/docker-build-push.yml"
      - ".github/workflows/docker-image-1.0.1-fork.yml"
      - ".github/workflows/docker-image-integration.yml"
      - ".github/workflows/test.yml"
permissions:
  contents: read
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fork and integration image contract
        run: test/fork-integration-contract.sh
      - name: ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # v2.0.0
        with:
          scandir: .
          ignore_names: mhserveremu-config.sh
          additional_files: docker-entrypoint.sh start-server
      - name: Hadolint — Dockerfile
        uses: hadolint/hadolint-action@2a66e89f53d0771bb131a7fa31f3136336094aa6 # v3.4.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error
      - name: Hadolint — Dockerfile.alpine
        uses: hadolint/hadolint-action@2a66e89f53d0771bb131a7fa31f3136336094aa6 # v3.4.0
        with:
          dockerfile: Dockerfile.alpine
          failure-threshold: error
      - name: EditorConfig check
        uses: editorconfig-checker/action-editorconfig-checker@51f63319f592f97930c73d9c46184d20bd206393 # v3.0.0

  test:
    name: Image Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: '1.0.0'
          - version: '1.0.1'
          - version: 'nightly'
          - version: '1.0.1-fork'
          - version: 'integration-master'
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up rclone
        uses: AnimMouse/setup-rclone@26ef2133e09fd383329a1d4c1fbe6a71db1976c9 # v1.12.0
        with:
          rclone_config: ${{ secrets.RCLONE_CONFIG }}
      - name: Download necessary files
        run: |
          rclone copy r2:private-dependencies/Calligraphy.sip ${{ github.workspace }}
          rclone copy r2:private-dependencies/mu_cdata.sip ${{ github.workspace }}
      - name: Run tests
        run: make test-${{ matrix.version }}

  config-test:
    name: Config Test (${{ matrix.variant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: debian
            dockerfile: Dockerfile
            image: mhserveremu-config-test-debian
          - variant: alpine
            dockerfile: Dockerfile.alpine
            image: mhserveremu-config-test-alpine
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build fork config test image
        run: docker build --target config-test --build-arg MHSERVEREMU_VERSION=1.0.1-fork --tag ${{ matrix.image }}-1.0.1-fork --file ${{ matrix.dockerfile }} .
      - name: Build integration config test image
        run: docker build --target config-test --build-arg MHSERVEREMU_VERSION=integration-master --tag ${{ matrix.image }}-integration-master --file ${{ matrix.dockerfile }} .
      - name: Run fork and integration config test contract
        run: test/fork-integration-config.sh ${{ matrix.image }}-1.0.1-fork ${{ matrix.image }}-integration-master
